<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="356" viewBox="0 0 1020 356" role="img" aria-label="Keep warm">
<title>Keep warm</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#172033"/></marker></defs>
<rect width="1020" height="356" fill="#ffffff"/>
<text x="24" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#172033" font-weight="600" text-anchor="start">Keep warm</text>
<line x1="40" y1="150" x2="980" y2="150" stroke="#172033" stroke-width="2"/>
<circle cx="60" cy="150" r="7" fill="#172033"/>
<text x="60" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">last turn ends</text>
<text x="60" y="180" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6170" font-weight="normal" text-anchor="middle">cache written</text>
<circle cx="300" cy="150" r="7" fill="#172033"/>
<text x="300" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">ping 1</text>
<text x="300" y="180" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6170" font-weight="normal" text-anchor="middle">reads the cache</text>
<circle cx="540" cy="150" r="7" fill="#172033"/>
<text x="540" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">ping 2</text>
<text x="540" y="180" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6170" font-weight="normal" text-anchor="middle">reads the cache</text>
<circle cx="780" cy="150" r="7" fill="#172033"/>
<text x="780" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">ping 3</text>
<circle cx="940" cy="150" r="7" fill="#172033"/>
<text x="940" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">limit reached</text>
<text x="940" y="180" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6170" font-weight="normal" text-anchor="middle">keep-warm stops</text>
<path d="M70,202 L290,202" stroke="#c4c8d0" stroke-width="1.5" marker-end="url(#a)"/>
<text x="180.0" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6170" font-weight="normal" text-anchor="middle">TTL minus a margin</text>
<path d="M310,202 L530,202" stroke="#c4c8d0" stroke-width="1.5" marker-end="url(#a)"/>
<text x="420.0" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6170" font-weight="normal" text-anchor="middle">TTL minus a margin</text>
<path d="M550,202 L770,202" stroke="#c4c8d0" stroke-width="1.5" marker-end="url(#a)"/>
<text x="660.0" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6170" font-weight="normal" text-anchor="middle">TTL minus a margin</text>
<text x="40" y="70" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#111111" font-weight="normal" text-anchor="start">Turn it on with k (2 h) or /compagnon keepwarm &lt;hours&gt;. Margin: 8 min on a 1 h cache, 90 s on a 5 min cache.</text>
<text x="40" y="90" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#111111" font-weight="normal" text-anchor="start">A ping is a short request with no tool. It never runs during a turn. Each ping uses a little of your plan.</text>
<rect x="40" y="260" width="300" height="70" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="190.0" y="291.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">Stops early when</text>
<text x="190.0" y="309.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">a ping gets no answer</text>
<rect x="360" y="260" width="300" height="70" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="510.0" y="291.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">Stops early when</text>
<text x="510.0" y="309.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">a ping rewrites the cache</text>
<rect x="680" y="260" width="300" height="70" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="830.0" y="291.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">The Model card says</text>
<text x="830.0" y="309.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">"keep-warm stopped: &lt;why&gt;"</text>
</svg>
