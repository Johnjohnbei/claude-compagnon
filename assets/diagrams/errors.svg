<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="302" viewBox="0 0 1044 302" role="img" aria-label="Errors of the mod">
<title>Errors of the mod</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#172033"/></marker></defs>
<rect width="1044" height="302" fill="#ffffff"/>
<text x="24" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#172033" font-weight="600" text-anchor="start">Errors of the mod</text>
<rect x="24" y="64" width="220" height="64" rx="4" fill="#ffffff" stroke="#172033" stroke-width="1.5"/>
<text x="134.0" y="101.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">A hook of the mod fails</text>
<path d="M244,96 L290,96" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="290" y="64" width="260" height="64" rx="4" fill="#eef0f4" stroke="#172033" stroke-width="1.5"/>
<text x="420.0" y="92.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">Recorded in errorLog</text>
<text x="420.0" y="110.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="normal" text-anchor="middle">message only, last 20 kept</text>
<path d="M550,96 L600,96" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="52" width="420" height="40" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="810.0" y="77.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">band:  … · ctx 41% · ⚠ 2</text>
<rect x="600" y="100" width="420" height="40" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="810.0" y="125.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">pane Errors row: ✕ 2, unfolded (e): ⚠ 2 errors, last: …</text>
<path d="M420,128 L420,176" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="290" y="176" width="260" height="52" rx="4" fill="#172033" stroke="#172033" stroke-width="1.5"/>
<text x="420.0" y="198.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">/compagnon errors</text>
<text x="420.0" y="216.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="normal" text-anchor="middle">date, time, message</text>
<text x="24" y="262" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6170" font-weight="normal" text-anchor="start">The work goes on: a failing hook passes the prompt or the tool call through. The band and the pane Errors row count this</text>
<text x="24" y="282" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6170" font-weight="normal" text-anchor="start">session's errors; the command lists the last 20 of all sessions.</text>
