<svg xmlns="http://www.w3.org/2000/svg" width="884" height="452" viewBox="0 0 884 452" role="img" aria-label="Cold cache guard">
<title>Cold cache guard</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#172033"/></marker></defs>
<rect width="884" height="452" fill="#ffffff"/>
<text x="24" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#172033" font-weight="600" text-anchor="start">Cold cache guard</text>
<rect x="24" y="60" width="220" height="52" rx="4" fill="#ffffff" stroke="#172033" stroke-width="1.5"/>
<text x="134.0" y="91.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">You send a message</text>
<path d="M244,86 L290,86" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="290" y="54" width="300" height="64" rx="4" fill="#eef0f4" stroke="#172033" stroke-width="1.5"/>
<text x="440.0" y="73.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">Cache cold and context</text>
<text x="440.0" y="91.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="normal" text-anchor="middle">over coldGuardTokens?</text>
<text x="440.0" y="109.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="normal" text-anchor="middle">(150k by default)</text>
<path d="M590,86 L660,86" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<text x="612" y="78" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6170" font-weight="normal" text-anchor="start">no</text>
<rect x="660" y="60" width="200" height="52" rx="4" fill="#172033" stroke="#172033" stroke-width="1.5"/>
<text x="760.0" y="91.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Sent as typed</text>
<path d="M440,118 L440,160" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<text x="448" y="143" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6170" font-weight="normal" text-anchor="start">yes</text>
<rect x="250" y="160" width="380" height="52" rx="4" fill="#eef0f4" stroke="#172033" stroke-width="1.5"/>
<text x="440.0" y="182.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="600" text-anchor="middle">The mod asks: "Cold cache"</text>
<text x="440.0" y="200.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#111111" font-weight="normal" text-anchor="middle">sending now rereads N k tokens</text>
<path d="M440,212 L120,262" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="262" width="192" height="52" rx="4" fill="#172033" stroke="#172033" stroke-width="1.5"/>
<text x="120.0" y="293.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Send</text>
<rect x="24" y="330" width="192" height="70" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="120.0" y="361.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">rereads the whole</text>
<text x="120.0" y="379.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">context once</text>
<path d="M440,212 L334,262" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="238" y="262" width="192" height="52" rx="4" fill="#172033" stroke="#172033" stroke-width="1.5"/>
<text x="334.0" y="293.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Compact then send</text>
<rect x="238" y="330" width="192" height="70" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="334.0" y="361.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">compacts first,</text>
<text x="334.0" y="379.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">then sends</text>
<path d="M440,212 L548,262" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="452" y="262" width="192" height="52" rx="4" fill="#172033" stroke="#172033" stroke-width="1.5"/>
<text x="548.0" y="284.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Handoff then</text>
<text x="548.0" y="302.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="normal" text-anchor="middle">fresh session</text>
<rect x="452" y="330" width="192" height="70" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="548.0" y="352.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">handoff written,</text>
<text x="548.0" y="370.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">message resent</text>
<text x="548.0" y="388.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">in the new session</text>
<path d="M440,212 L762,262" fill="none" stroke="#172033" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="666" y="262" width="192" height="52" rx="4" fill="#172033" stroke="#172033" stroke-width="1.5"/>
<text x="762.0" y="293.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="666" y="330" width="192" height="70" rx="4" fill="#ffffff" stroke="#c4c8d0" stroke-width="1.5"/>
<text x="762.0" y="361.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">message held,</text>
<text x="762.0" y="379.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6170" font-weight="normal" text-anchor="middle">nothing sent</text>
<text x="24" y="430" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6170" font-weight="normal" text-anchor="start">Only messages you type are checked, never a /command. With nobody to answer (claude -p), the message is sent.</text>
</svg>
